services:
  php_cuda_dev:
    build:
      context: .
      args:
        CUDA_IMAGE: ${CUDA_IMAGE:-nvidia/cuda:12.3.2-devel-ubuntu22.04}
        PHP_VERSION: ${PHP_VERSION:-8.1}
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    volumes:
      - .:/usr/src/ext
      # Carrega a extensão compilada pelo compile.sh no PHP CLI do container.
      - ./php.ini:/etc/php/8.1/cli/conf.d/99-cuda.ini:ro
    tty: true
    user: root
